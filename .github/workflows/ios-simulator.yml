name: iOS Simulator
on:
  push:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile the iPhone Simulator app and run layout tests
        timeout-minutes: 5
        run: bash tools/simulator_smoke.sh build
      - name: Boot an iPhone and render the launcher and HUD
        timeout-minutes: 9
        run: bash tools/simulator_smoke.sh run
      - name: Upload Simulator screenshots
        uses: actions/upload-artifact@v4
        with:
          name: wow-forever-ios-simulator
          path: .build/simulator/*.png
          if-no-files-found: error
          include-hidden-files: true

  client:
    runs-on: macos-15
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply the port to the pinned Playport source
        run: bash tools/prepare_device.sh
      - name: Build the Battle.net download client with the Forever product
        run: xcrun swift build --package-path .build/playport/app/BattleNetClient --target BattleNetClientKit -j 2
      - name: Check ContentKit archive integrity tests
        run: xcrun swift test --package-path .build/playport/app/ContentKit --filter ZipArchiveTests -j 2
