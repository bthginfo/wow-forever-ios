name: iOS Simulator
on:
  push:
  workflow_dispatch:
    inputs:
      live_metadata:
        description: Check the current EU install metadata on Blizzard's CDN
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile the iPhone Simulator app and run layout tests
        timeout-minutes: 5
        run: bash tools/simulator_smoke.sh build
      - name: Boot an iPhone and render the launcher and HUD
        timeout-minutes: 9
        run: bash tools/simulator_smoke.sh run
      - name: Upload Simulator screenshots
        uses: actions/upload-artifact@v4
        with:
          name: wow-forever-ios-simulator
          path: .build/simulator/*.png
          if-no-files-found: error
          include-hidden-files: true

  client:
    runs-on: macos-15
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply the port to the pinned Playport source
        run: bash tools/prepare_device.sh
      - name: Test the Battle.net download client with the Forever product
        env:
          FOREVER_LIVE_METADATA: ${{ (inputs.live_metadata || contains(github.event.head_commit.message, '[check Blizzard]')) && '1' || '0' }}
        run: |
          package=.build/playport/app/BattleNetClient
          mkdir -p "$package/Tests/ForeverOfferCheck"
          cp Tests/ForeverOfferCheck.swift "$package/Tests/ForeverOfferCheck/"
          cat >> "$package/Package.swift" <<'SWIFT'

          package.targets.append(.executableTarget(
              name: "ForeverOfferCheck",
              dependencies: ["BattleNetClientKit", .product(name: "ContentKit", package: "ContentKit")],
              path: "Tests/ForeverOfferCheck"
          ))
          SWIFT
          xcrun swift run --package-path "$package" -j 2 ForeverOfferCheck
      - name: Check ContentKit archive integrity tests
        run: xcrun swift test --package-path .build/playport/app/ContentKit --filter ZipArchiveTests -j 2
